name: Release

# Publishes @uwmd/core (library), @uwmd/cli (CLI installer),
# @uwmd/signing (RFC 0010 signing companion), and @uwmd/batch (collection
# indexer + corpus fact table) to npm when a version tag (v*) is pushed.
# Core and cli share the tag — they version in lockstep because the CLI
# re-exposes the library's CLI module. Signing and batch version
# independently (their manifest versions, not the tag) and publish only when
# that version is not already on npm, so a release that didn't bump one is a
# no-op for it.
#
# Authentication is npm trusted publishing (OIDC) — there is no NPM_TOKEN and
# no secret of any kind. The runner exchanges its `id-token` for a short-lived
# token scoped to this repo and workflow, which is why `permissions: id-token:
# write` below is load-bearing rather than decoration.
#
# Prerequisites (one-time, on npmjs.com — nothing to configure in this repo):
#   For EACH of @uwmd/core, @uwmd/cli, @uwmd/signing, and @uwmd/batch:
#   package page -> Settings -> Trusted publisher -> GitHub Actions, with
#     Organization or user: UWMD-OSP
#     Repository:           UW-Markdown
#     Workflow filename:    release.yml     (filename only, no path, with .yml)
#     Allowed actions:      publish
#     Environment:          (leave blank)
#
# All four are required (see docs/handoff/HUMAN-configure-batch-trusted-publisher.md
# for the batch one). Configure only some and the run fails partway,
# publishing an incomplete set — recoverable, because every publish step below
# skips a version that is already live, so re-running the job after fixing the
# publisher finishes the remainder without EPUBLISHCONFLICT on the ones that
# landed. A missing or mismatched trusted publisher surfaces as ENEEDAUTH,
# exactly as a missing token used to.
#
# npm allows ONE trusted publisher per package, which is why
# publish-cli-recovery.yml cannot authenticate without a temporary repoint —
# see the note in that file before reaching for it.
#
# The `uwmd` unscoped name is NOT used by this workflow; the CLI publishes as
# @uwmd/cli. An earlier version of this note said otherwise.
#
# Node is pinned at 22.14.0 because that is npm's documented minimum for
# trusted publishing; do not lower it.
#
# Tag and ship a release:
#   git tag v1.3.1 && git push origin v1.3.1

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    name: Publish @uwmd/core + @uwmd/cli + @uwmd/signing + @uwmd/batch
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # for npm provenance
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.14.0
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      # Node 22.14.0 bundles npm 10.x, which has no OIDC support and would fall
      # back to looking for a token that no longer exists. Pinned rather than
      # `@latest` so a release is not at the mercy of whatever npm shipped this
      # morning — the whole point of this job is reproducibility.
      - name: Upgrade npm for trusted publishing (OIDC needs >= 11.5.1)
        run: |
          npm install -g npm@11.5.1
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify publishable package contents
        run: npm run verify-packages


      - name: Run unit tests
        run: npm test

      - name: Run conformance suite (tiers 1-3 + lite + receipts)
        run: npm run conformance

      - name: Validate JSON Schemas
        run: npm run validate-schemas

      - name: Verify package versions match tag
        run: |
          CORE_VERSION="v$(node -p "require('./packages/uwmd-core/package.json').version")"
          CLI_VERSION="v$(node -p "require('./packages/uwmd-cli/package.json').version")"
          if [ "$CORE_VERSION" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match @uwmd/core version $CORE_VERSION"
            exit 1
          fi
          if [ "$CLI_VERSION" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match uwmd version $CLI_VERSION"
            exit 1
          fi
          # The CLI declares an exact-version dep on @uwmd/core; verify it.
          DECLARED_DEP=$(node -p "require('./packages/uwmd-cli/package.json').dependencies['@uwmd/core']")
          EXPECTED_DEP="${CORE_VERSION#v}"
          if [ "$DECLARED_DEP" != "$EXPECTED_DEP" ]; then
            echo "uwmd depends on @uwmd/core@$DECLARED_DEP but expected $EXPECTED_DEP"
            exit 1
          fi

      # No NODE_AUTH_TOKEN on either publish: authentication is npm trusted
      # publishing (OIDC). The runner exchanges the `id-token: write` credential
      # above for a short-lived npm token scoped to this repo and workflow, so
      # there is no long-lived secret to store, rotate, or leak. Provenance is
      # attached automatically under OIDC; `--provenance` stays explicit so the
      # intent survives a future edit.
      #
      # This requires a trusted publisher configured on npmjs.com for BOTH
      # packages, naming org `UWMD-OSP`, repo `UW-Markdown`, workflow
      # `release.yml`. Without it the publish fails with ENEEDAUTH, the same way
      # a missing token did.
      # Every publish step is idempotent: a version already on npm is skipped,
      # so re-running this job after a partial failure (e.g. one package's
      # trusted publisher missing) finishes the remainder instead of dying on
      # EPUBLISHCONFLICT for the ones that landed.
      - name: Publish @uwmd/core to npm with provenance
        working-directory: packages/uwmd-core
        run: |
          VER=$(node -p "require('./package.json').version")
          if npm view "@uwmd/core@$VER" version >/dev/null 2>&1; then
            echo "@uwmd/core@$VER is already on npm — skipping"
          else
            npm publish --provenance --access public
          fi

      - name: Publish @uwmd/cli to npm with provenance
        working-directory: packages/uwmd-cli
        run: |
          VER=$(node -p "require('./package.json').version")
          if npm view "@uwmd/cli@$VER" version >/dev/null 2>&1; then
            echo "@uwmd/cli@$VER is already on npm — skipping"
          else
            npm publish --provenance --access public
          fi

      # @uwmd/signing versions independently of the tag (owner decision
      # 2026-09-01: publish it). First publish requires its trusted publisher
      # to exist — docs/handoff/HUMAN-configure-signing-trusted-publisher.md.
      # Deliberately last: if its publisher is missing, core+cli are already
      # fully published as a matched pair before this step fails.
      - name: Publish @uwmd/signing to npm with provenance
        working-directory: packages/uwmd-signing
        run: |
          VER=$(node -p "require('./package.json').version")
          if npm view "@uwmd/signing@$VER" version >/dev/null 2>&1; then
            echo "@uwmd/signing@$VER is already on npm — skipping"
          else
            npm publish --provenance --access public
          fi

      # @uwmd/batch versions independently of the tag (owner decision
      # 2026-09-03: publish it, so the underwriter.cc screener needn't clone
      # the repo). First publish requires its trusted publisher to exist —
      # docs/handoff/HUMAN-configure-batch-trusted-publisher.md. Deliberately
      # last: if its publisher is missing, core+cli+signing are already fully
      # published before this step fails, and a re-run after binding finishes
      # batch alone (every step above skips versions already live).
      - name: Publish @uwmd/batch to npm with provenance
        working-directory: packages/uwmd-batch
        run: |
          VER=$(node -p "require('./package.json').version")
          if npm view "@uwmd/batch@$VER" version >/dev/null 2>&1; then
            echo "@uwmd/batch@$VER is already on npm — skipping"
          else
            npm publish --provenance --access public
          fi
