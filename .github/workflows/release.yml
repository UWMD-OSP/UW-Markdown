name: Release

# Publishes @uwmd/core (library), @uwmd/cli (CLI installer),
# @uwmd/signing (RFC 0010 signing companion), and @uwmd/batch (collection
# indexer + corpus fact table), @uwmd/module-hospitality and
# @uwmd/module-data-center to npm on the next ordinary v<core-version> release.
# Core and cli share the tag — they version in lockstep because the CLI
# re-exposes the library's CLI module. Signing, batch and module packages version
# independently (package.json versions, not the tag or module contract) and publish only when
# that version is not already on npm, so a release that didn't bump one is a
# no-op for it.
#
# Authentication is npm trusted publishing (OIDC) — there is no NPM_TOKEN and
# no secret of any kind. The runner exchanges its `id-token` for a short-lived
# token scoped to this repo and workflow, which is why `permissions: id-token:
# write` below is load-bearing rather than decoration.
#
# Prerequisites (one-time, on npmjs.com — nothing to configure in this repo):
#   For EACH of the six packages named above:
#   package page -> Settings -> Trusted publisher -> GitHub Actions, with
#     Organization or user: UWMD-OSP
#     Repository:           UW-Markdown
#     Workflow filename:    release.yml     (filename only, no path, with .yml)
#     Allowed actions:      publish
#     Environment:          (leave blank)
#
# All six need confirmed package ownership/public access and a trusted publisher.
# First-time module provisioning is a human prerequisite (wiki 11); it is not
# performed here. npm allows multiple trusted publishers per package; recovery
# can use a separately authorized workflow without replacing the release entry.
# Registry probes fail closed on network/authentication/service errors. Only a
# confirmed missing public package/version permits publication. Existing versions
# are skipped, so a rerun can finish a partial release without republishing.
#
# The `uwmd` unscoped name is NOT used by this workflow; the CLI publishes as
# @uwmd/cli. An earlier version of this note said otherwise.
#
# Node is pinned at 22.14.0 because that is npm's documented minimum for
# trusted publishing; do not lower it.
#
# Tag and ship a release:
#   git tag v1.3.1 && git push origin v1.3.1

on:
  push:
    tags:
      - 'v*'
      - 'v*.*.*'

jobs:
  publish:
    name: Publish six official UWMD packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # for npm provenance
    steps:
      # Full history and tags: the release-record check below also compares
      # every CHANGELOG section marked released against its tag, and a shallow
      # tag checkout holds only the one tag being pushed.
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.14.0
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      # The tag must land on a release-prepared commit: one whose records are
      # final and publication-neutral (scripts/release-state.mjs).
      #   - The CHANGELOG heading is dated.
      #   - No VERSIONS.md row, protocol status line or CHANGELOG heading still
      #     calls this generation a candidate or unreleased, or names the
      #     previous publication.
      #   - Core, CLI and PROTOCOL_VERSION pair exactly.
      #   - Nothing yet claims `### Released`, which the post-publication
      #     reconciliation adds.
      #   - `## [Unreleased]` holds no entries, so a later commit of main
      #     cannot publish under the prepared version.
      # v2.14.0 and v2.15.0 were tagged on commits that still said "candidate"
      # and "unreleased". This runs before install, so such a tree fails before
      # anything publishes; the owner then fixes the release commit and tags
      # that instead.
      - name: Verify the tagged tree's release records are final
        run: node scripts/verify-release.mjs --tag "${GITHUB_REF_NAME}"

      # Node 22.14.0 bundles npm 10.x, which has no OIDC support and would fall
      # back to looking for a token that no longer exists. Pinned rather than
      # `@latest` so a release is not at the mercy of whatever npm shipped this
      # morning — the whole point of this job is reproducibility.
      - name: Upgrade npm for trusted publishing (OIDC needs >= 11.5.1)
        run: |
          npm install -g npm@11.5.1
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify publishable package contents
        run: npm run verify-packages


      - name: Verify six-package release readiness and registry-probe tests
        run: npm run release:check

      - name: Run unit tests
        run: npm test

      - name: Run conformance suite (tiers 1-3 + lite + receipts)
        run: npm run conformance

      - name: Validate JSON Schemas
        run: npm run validate-schemas

      - name: Verify package versions match tag
        run: |
          CORE_VERSION="v$(node -p "require('./packages/uwmd-core/package.json').version")"
          CLI_VERSION="v$(node -p "require('./packages/uwmd-cli/package.json').version")"
          if [ "$CORE_VERSION" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match @uwmd/core version $CORE_VERSION"
            exit 1
          fi
          if [ "$CLI_VERSION" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match uwmd version $CLI_VERSION"
            exit 1
          fi
          # The CLI declares an exact-version dep on @uwmd/core; verify it.
          DECLARED_DEP=$(node -p "require('./packages/uwmd-cli/package.json').dependencies['@uwmd/core']")
          EXPECTED_DEP="${CORE_VERSION#v}"
          if [ "$DECLARED_DEP" != "$EXPECTED_DEP" ]; then
            echo "uwmd depends on @uwmd/core@$DECLARED_DEP but expected $EXPECTED_DEP"
            exit 1
          fi

      # No NODE_AUTH_TOKEN on either publish: authentication is npm trusted
      # publishing (OIDC). The runner exchanges the `id-token: write` credential
      # above for a short-lived npm token scoped to this repo and workflow, so
      # there is no long-lived secret to store, rotate, or leak. Provenance is
      # attached automatically under OIDC; `--provenance` stays explicit so the
      # intent survives a future edit.
      #
      # This requires a trusted publisher configured on npmjs.com for all six
      # packages, naming org `UWMD-OSP`, repo `UW-Markdown`, workflow
      # `release.yml`. Without it the publish fails with ENEEDAUTH, the same way
      # a missing token did.
      # Every publish step is idempotent: a version already on npm is skipped,
      # so re-running this job after a partial failure (e.g. one package's
      # trusted publisher missing) finishes the remainder instead of dying on
      # EPUBLISHCONFLICT for the ones that landed.
      - name: Publish @uwmd/core to npm with provenance
        working-directory: packages/uwmd-core
        run: |
          VER=$(node -p "require('./package.json').version")
          STATE=$(node "$GITHUB_WORKSPACE/scripts/registry-version-state.mjs" "@uwmd/core" "$VER")
          if [ "$STATE" = "published" ]; then
            echo "@uwmd/core@$VER is already on npm — skipping"
          elif [ "$STATE" = "absent" ]; then
            npm publish --provenance --access public
          else
            echo "Unexpected registry state: $STATE" >&2
            exit 1
          fi

      - name: Publish @uwmd/cli to npm with provenance
        working-directory: packages/uwmd-cli
        run: |
          VER=$(node -p "require('./package.json').version")
          STATE=$(node "$GITHUB_WORKSPACE/scripts/registry-version-state.mjs" "@uwmd/cli" "$VER")
          if [ "$STATE" = "published" ]; then
            echo "@uwmd/cli@$VER is already on npm — skipping"
          elif [ "$STATE" = "absent" ]; then
            npm publish --provenance --access public
          else
            echo "Unexpected registry state: $STATE" >&2
            exit 1
          fi

      # @uwmd/signing versions independently of the tag (owner decision
      # 2026-09-01: publish it). Its trusted publisher must be confirmed first.
      # It follows core+cli so those are a matched pair if a later step fails.
      - name: Publish @uwmd/signing to npm with provenance
        working-directory: packages/uwmd-signing
        run: |
          VER=$(node -p "require('./package.json').version")
          STATE=$(node "$GITHUB_WORKSPACE/scripts/registry-version-state.mjs" "@uwmd/signing" "$VER")
          if [ "$STATE" = "published" ]; then
            echo "@uwmd/signing@$VER is already on npm — skipping"
          elif [ "$STATE" = "absent" ]; then
            npm publish --provenance --access public
          else
            echo "Unexpected registry state: $STATE" >&2
            exit 1
          fi

      # @uwmd/batch versions independently of the tag (owner decision
      # 2026-09-03: publish it, so the underwriter.cc screener needn't clone
      # the repo). Its trusted publisher must be confirmed first. Reruns skip
      # already-published versions and finish remaining packages after fixing
      # the documented prerequisite; publication is sequential, not atomic.
      - name: Publish @uwmd/batch to npm with provenance
        working-directory: packages/uwmd-batch
        run: |
          VER=$(node -p "require('./package.json').version")
          STATE=$(node "$GITHUB_WORKSPACE/scripts/registry-version-state.mjs" "@uwmd/batch" "$VER")
          if [ "$STATE" = "published" ]; then
            echo "@uwmd/batch@$VER is already on npm — skipping"
          elif [ "$STATE" = "absent" ]; then
            npm publish --provenance --access public
          else
            echo "Unexpected registry state: $STATE" >&2
            exit 1
          fi

      - name: Publish @uwmd/module-hospitality to npm with provenance
        working-directory: packages/uwmd-module-hospitality
        run: |
          VER=$(node -p "require('./package.json').version")
          STATE=$(node "$GITHUB_WORKSPACE/scripts/registry-version-state.mjs" "@uwmd/module-hospitality" "$VER")
          if [ "$STATE" = "published" ]; then
            echo "@uwmd/module-hospitality@$VER is already on npm — skipping"
          elif [ "$STATE" = "absent" ]; then
            npm publish --provenance --access public
          else
            echo "Unexpected registry state: $STATE" >&2
            exit 1
          fi

      - name: Publish @uwmd/module-data-center to npm with provenance
        working-directory: packages/uwmd-module-data-center
        run: |
          VER=$(node -p "require('./package.json').version")
          STATE=$(node "$GITHUB_WORKSPACE/scripts/registry-version-state.mjs" "@uwmd/module-data-center" "$VER")
          if [ "$STATE" = "published" ]; then
            echo "@uwmd/module-data-center@$VER is already on npm — skipping"
          elif [ "$STATE" = "absent" ]; then
            npm publish --provenance --access public
          else
            echo "Unexpected registry state: $STATE" >&2
            exit 1
          fi
