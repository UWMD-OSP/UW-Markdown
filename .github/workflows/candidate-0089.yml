name: RFC 0089 candidate evidence

on:
  pull_request:
    paths:
      - 'conformance/candidate-0089/**'
      - '.github/workflows/candidate-0089.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    name: Isolated candidate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run build
      - name: Exact source, carrier, refusal, authentication and consumer controls
        run: node --test --test-concurrency=1 conformance/candidate-0089/carriers.test.mjs conformance/candidate-0089/authentication.test.mjs conformance/candidate-0089/refusals.test.mjs conformance/candidate-0089/consumers.test.mjs conformance/candidate-0089/repairs.test.mjs conformance/candidate-0089/reviewer.test.mjs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: candidate-0089-${{ matrix.os }}-${{ github.sha }}
          path: node_modules/.cache/rfc0089-evidence
          if-no-files-found: error
