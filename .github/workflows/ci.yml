name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual trigger, so CI can be re-run without inventing a commit — useful
  # when a run failed for an infrastructure reason rather than a code one.
  workflow_dispatch:

jobs:
  verify-lockfile:
    name: Verify workspace lockfile pins
    runs-on: ubuntu-latest
    # No `npm ci` on purpose: this job reads the lockfiles as data, and the
    # thing it guards against is precisely an install resolving @uwmd/* from the
    # registry. Running it before any install keeps it honest and fast.
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - run: npm run verify-lockfile

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint

  build-and-test:
    name: Build and test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
      - name: Verify publishable package contents
        if: matrix.node == 20
        run: npm run verify-packages


      - name: Test
        run: npm test

      - name: Run conformance suite (every default suite)
        # Deliberately not a pinned --tier list. The pinned list silently
        # excluded the Tier-4 replay suite after it landed, so a suite could be
        # added to the runner's default and never actually gate a pull request.
        run: npm run conformance

  web-editor:
    name: Web editor (build + test)
    runs-on: ubuntu-latest
    # tools/* are intentionally NOT npm-workspace members, so the root `npm test`
    # above doesn't cover them. The web editor is the Tier-2/3 calc-integrity
    # chokepoint and carries its own vitest suite — run it here. It consumes
    # @uwmd/core's built dist via a file: dependency, so core must be built first.
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - name: Install workspaces
        run: npm ci
      - name: Build @uwmd/core (web editor imports its dist)
        run: npm run build
      - name: Install web-editor deps
        run: npm ci
        working-directory: tools/web-editor
      - name: Build web editor (tsc --noEmit + vite)
        run: npm run build
        working-directory: tools/web-editor
      - name: Test web editor
        run: npm test
        working-directory: tools/web-editor

  vscode-extension:
    name: VS Code extension (build + test)
    runs-on: ubuntu-latest
    # Same reason as the web editor: tools/* are not workspace members, so the
    # root `npm test` doesn't reach them. The extension's receipt verification
    # is pure logic behind a `vscode`-free module, so it runs under plain vitest
    # with no editor harness. It consumes @uwmd/core's built dist, so core must
    # be built first.
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - name: Install workspaces
        run: npm ci
      - name: Build @uwmd/core (the extension imports its dist)
        run: npm run build
      - name: Install extension deps
        run: npm ci
        working-directory: tools/vscode-uwmd
      - name: Typecheck extension
        run: npx tsc --noEmit
        working-directory: tools/vscode-uwmd
      - name: Bundle extension (esbuild)
        run: npm run build
        working-directory: tools/vscode-uwmd
      - name: Test extension
        run: npm test
        working-directory: tools/vscode-uwmd

  coverage:
    name: Coverage report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Run @uwmd/core test suite with coverage
        run: npm --prefix packages/uwmd-core run test:coverage
      - name: Publish coverage summary
        if: always()
        run: |
          set -e
          summary=packages/uwmd-core/coverage/coverage-summary.json
          if [ ! -f "$summary" ]; then
            echo "::warning ::coverage-summary.json not found at $summary"
            exit 0
          fi
          {
            echo "## @uwmd/core coverage"
            echo ""
            node -e '
              const s = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).total;
              const fmt = (m) => m.pct.toFixed(2) + "% (" + m.covered + "/" + m.total + ")";
              console.log("| Metric | Coverage |");
              console.log("|---|---|");
              for (const k of ["lines", "statements", "functions", "branches"]) {
                console.log("| " + k + " | " + fmt(s[k]) + " |");
              }
            ' "$summary"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: uwmd-core-coverage
          path: packages/uwmd-core/coverage/
          retention-days: 14

  validate-schemas:
    name: Validate JSON Schemas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Compile every schema in spec/schemas/
        run: npm run validate-schemas

  windows-build-and-test:
    name: Build, test, and conformance (Windows, Node 20)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
      - name: Run conformance suite (every default suite)
        # Deliberately not a pinned --tier list. The pinned list silently
        # excluded the Tier-4 replay suite after it landed, so a suite could be
        # added to the runner's default and never actually gate a pull request.
        run: npm run conformance
