name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build and test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Verify conformance fixtures parse
        run: |
          for f in conformance/tier-1-reader/fixtures/*.uw.md; do
            echo "Parsing $f"
            node packages/uwmd-core/dist/cli.js parse "$f" > /dev/null
          done

  validate-schema:
    name: Validate module manifest JSON Schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate schema is well-formed
        run: |
          npx --yes ajv-cli compile -s spec/schemas/module-manifest.schema.json
