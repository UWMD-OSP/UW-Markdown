name: CI

on:
  push:
    branches: [main]
  # Deliberately unfiltered. A `branches:` filter here matches the *base* of the
  # pull request, not its head, so `[main]` silently gave a stacked PR — one
  # opened against another feature branch — no CI at all. It did not fail; it
  # reported nothing, which reads as green next to whatever external checks do
  # run. Every pull request gets the suite, whatever it targets.
  pull_request:
  # Manual trigger, so CI can be re-run without inventing a commit — useful
  # when a run failed for an infrastructure reason rather than a code one.
  workflow_dispatch:
    inputs:
      verify-publication:
        description: 'Read-only registry, provenance and downstream verification'
        type: boolean
        default: false
      release-commit:
        description: 'Exact approved release commit (required for publication verification)'
        type: string
        default: ''

jobs:
  python-reader-foundation:
    name: Independent Python Reader foundation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The implementation uses only Python's standard library. Unit controls
      # and actual portable Reader projections are separate evidence; neither
      # claims full Verifier coverage or resolves RFC 0088 numerical semantics.
      - name: Independent unit controls
        run: python -m unittest discover -s implementations/python -v
      # Independent pinned-procedure controls, separately labeled from Reader evidence.
      # Reuse these three Python runtimes; no additional job or dependency install.
      - name: Independent Python pinned numerical procedure controls
        if: hashFiles('experiments/numerical-0088/python-fdlibm/test_kernel.py') != ''
        run: |
          python -B -m unittest discover -s experiments/numerical-0088/python-fdlibm -p "test_*.py" -v
          python -B experiments/numerical-0088/python-fdlibm/check_evidence.py --output "${{ runner.temp }}/python-fdlibm-observations.json"
      - uses: actions/upload-artifact@v6
        if: always() && hashFiles('experiments/numerical-0088/python-fdlibm/test_kernel.py') != ''
        with:
          name: isolated-python-fdlibm-${{ matrix.os }}
          path: ${{ runner.temp }}/python-fdlibm-observations.json
          if-no-files-found: error
      - name: Portable Reader projections (no capability skips)
        run: python conformance/runner/runner.py --impl "python implementations/python/uwmd.py" --tier reader --no-skip --manifest-out python-reader-conformance.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: independent-python-reader-${{ matrix.os }}
          path: python-reader-conformance.json
          if-no-files-found: error

  verify-publication:
    name: Verify published release (explicit read-only request)
    if: github.event_name == 'workflow_dispatch' && inputs['verify-publication']
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v5
        with:
          node-version: 22.14.0
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install -g npm@11.5.1
      - run: npm ci
      - name: Verify actual published consumers and provenance
        env:
          RELEASE_COMMIT: ${{ inputs['release-commit'] }}
        run: node scripts/check-prepared-consumers.mjs --published "$RELEASE_COMMIT"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: publication-verification
          path: |
            publication-registry-evidence.json
            publication-cli-conformance.json
            publication-signatures.log
          if-no-files-found: error

  verify-lockfile:
    if: github.event_name != 'workflow_dispatch' || !inputs['verify-publication']
    name: Verify workspace lockfile pins
    runs-on: ubuntu-latest
    # No `npm ci` on purpose: this job reads the lockfiles as data, and the
    # thing it guards against is precisely an install resolving @uwmd/* from the
    # registry. Running it before any install keeps it honest and fast.
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - run: npm run verify-lockfile

  verify-versions:
    if: github.event_name != 'workflow_dispatch' || !inputs['verify-publication']
    name: Verify version matrix
    runs-on: ubuntu-latest
    # Same rationale as the lockfile job: this reads VERSIONS.md, the package
    # manifests, and protocol.ts as data, so it needs no install and no build.
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - run: npm run verify-versions

  verify-indexes:
    if: github.event_name != 'workflow_dispatch' || !inputs['verify-publication']
    name: Verify hand-maintained indexes
    runs-on: ubuntu-latest
    # Reads the schema README, the RFC index, the prebuild copy list and CLAUDE.md as
    # data — no install, no build, same rationale as the two guards above.
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - run: npm run verify-indexes

  verify-codes:
    if: github.event_name != 'workflow_dispatch' || !inputs['verify-publication']
    name: Verify validation-code contracts
    runs-on: ubuntu-latest
    # Reads verify's and core's sources, the two specs and the RFC frontmatter as text — no
    # install, no build, same rationale as the guards above. Exists because
    # RFC 0058 shipped nine of the ten codes it specified and nothing went red.
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - run: npm run verify-codes

  verify-issue-forms:
    if: github.event_name != 'workflow_dispatch' || !inputs['verify-publication']
    name: Verify issue forms and labels
    runs-on: ubuntu-latest
    # Holds the issue forms, .github/labels.json and docs/FEEDBACK.md to each
    # other. GitHub silently drops a form label that does not exist, and it
    # validates a form only when someone opens the issue page, so neither
    # failure would otherwise show up anywhere. Unlike the guards above this one
    # installs, because it parses YAML.
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run verify-issue-forms

  verify-release:
    if: github.event_name != 'workflow_dispatch' || !inputs['verify-publication']
    name: Verify release record
    runs-on: ubuntu-latest
    # Compares every version the CHANGELOG calls released against the git tags,
    # because the tag is what triggers `release.yml` and 1.4.0 never got one.
    # `fetch-tags` is load-bearing: without it the checkout has no tags, the
    # guard has nothing to compare against, and it would pass vacuously — which
    # is the failure it exists to prevent. It fails loudly on an empty tag list
    # rather than trusting the checkout.
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-tags: true
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - run: npm run verify-release
      - name: Check prepared tag records without creating a tag
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          import { changelogReleaseSections, changelogUnreleasedEntries } from './scripts/release-state.mjs';
          const version = JSON.parse(readFileSync('packages/uwmd-core/package.json', 'utf8')).version;
          const changelog = readFileSync('CHANGELOG.md', 'utf8');
          const section = changelogReleaseSections(changelog).find(value => value.version === version);
          if (section && / - \d{4}-\d{2}-\d{2}$/.test(section.heading) && !/^### Released\s*$/m.test(section.body) && changelogUnreleasedEntries(changelog).length === 0) {
            execFileSync(process.execPath, ['scripts/verify-release.mjs', '--tag', `v${version}`], { stdio: 'inherit' });
          } else {
            console.log('No release-prepared generation: ordinary release-record checks apply.');
          }
          JS
      - name: Observe published package identities (read-only)
        # Network reads apply only to release-prepared generations, never ordinary
        # development records. Publication retains its separate fail-closed probe.
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          import { RELEASE_PACKAGES } from './scripts/release-packages.mjs';
          import { registryVersionState } from './scripts/registry-version-state.mjs';
          import { changelogReleaseSections, changelogUnreleasedEntries } from './scripts/release-state.mjs';
          const version = JSON.parse(readFileSync('packages/uwmd-core/package.json', 'utf8')).version;
          const changelog = readFileSync('CHANGELOG.md', 'utf8');
          const section = changelogReleaseSections(changelog).find(value => value.version === version);
          const prepared = section && / - \d{4}-\d{2}-\d{2}$/.test(section.heading)
            && !/^### Released\s*$/m.test(section.body) && changelogUnreleasedEntries(changelog).length === 0;
          if (!prepared) {
            console.log('[SKIP] No release-prepared generation; no registry observation needed.');
          } else {
            const observed = [];
            for (const { name, dir } of RELEASE_PACKAGES) {
              const response = await fetch(`https://registry.npmjs.org/${encodeURIComponent(name)}/latest`, { signal: AbortSignal.timeout(15000) });
              if (!response.ok) throw new Error(`${name}: registry HTTP ${response.status}`);
              const value = await response.json();
              if (value.name !== name || typeof value.version !== 'string' || !value.dist?.integrity) throw new Error(`${name}: incomplete registry identity`);
              const prepared = JSON.parse(readFileSync(`${dir}/package.json`, 'utf8')).version;
              const prepared_state = await registryVersionState(name, prepared);
              observed.push({ name, version: value.version, gitHead: value.gitHead ?? null, integrity: value.dist.integrity, node: value.engines?.node ?? null, prepared, prepared_state });
            }
            console.log(JSON.stringify({ observed_at: new Date().toISOString(), registry: 'https://registry.npmjs.org', packages: observed }, null, 2));
          }
          JS

  lint:
    if: github.event_name != 'workflow_dispatch' || !inputs['verify-publication']
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint

  build-and-test:
    if: github.event_name != 'workflow_dispatch' || !inputs['verify-publication']
    name: Build and test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
      - name: Verify publishable package contents
        if: matrix.node == 20
        run: npm run verify-packages

      - name: Verify eight-package release readiness
        if: matrix.node == 20
        run: npm run release:check


      - name: Verify prepared archives as an isolated consumer
        if: matrix.node == 20
        run: node scripts/check-prepared-consumers.mjs

      - name: Type-check the test suite
        # `npm test` does not type-check: vitest transforms through esbuild,
        # which strips types without reading them, and the package tsconfig
        # excludes *.test.ts from the build. So a compile-time assertion inside
        # a test was inert, and a test could reference a symbol that no longer
        # exists and still report green. This step is the only thing that reads
        # those files as TypeScript.
        if: matrix.node == 20
        run: npm run typecheck:tests

      - name: Test
        run: npm test

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check activated numerical consumers and receipt precedence
        # Actual production APIs; no ESM loader or source transformation. Fresh
        # Python graphs must also match the immutable preactivation references.
        run: |
          python -B -m unittest discover -s experiments/numerical-0088/activation -p "test_*.py" -v
          python -B experiments/numerical-0088/activation/capture.py --output "${{ runner.temp }}/numerical-activation-proof"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: numerical-activation-${{ runner.os }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/numerical-activation-proof/
          if-no-files-found: error
          retention-days: 14

      - name: Run conformance suite (every default suite)
        # Deliberately not a pinned --tier list. The pinned list silently
        # excluded the agent replay suite after it landed, so a suite could be
        # added to the runner's default and never actually gate a pull request.
        run: npm run conformance

      - name: Run the verification examples
        # examples/verification is what a new adopter runs first; each script
        # exits 0 only when the verifier reports its documented verdicts.
        run: npm run examples:verification
      - name: Check the RFC 0004 case files are current
        # The cases are generated from the fixture directories. A fixture added
        # without regenerating them would silently drop out of the v2 driver's
        # coverage while every suite still reported green.
        if: matrix.node == 20
        run: npm run gen-conformance-cases -- --check

      - name: Set up Python for the conformance driver
        if: matrix.node == 20
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run the language-agnostic driver against the reference CLI
        # Not a replacement for the suite above: this drives the tier fixtures
        # through the §II.6a CLI protocol, which is what a non-TypeScript
        # implementation would use to self-certify. It gates the protocol, not
        # the corpus.
        #
        # Invoked as `python3` rather than through `npm run conformance:v2`,
        # whose script says `python` — the name that exists on a developer's
        # Windows box but is not guaranteed on a runner.
        if: matrix.node == 20
        run: python3 conformance/runner/runner.py --manifest-out conformance-report.json --no-skip

      - name: Check the capability-skip mechanism (RFC 0030)
        # The driver decides skips in Python; this recomputes them in JS from the
        # case files and compares. One implementation checked against its own
        # output would pass even when the rule is wrong.
        #
        # The step above runs with --no-skip so the reference implementation
        # cannot quietly stop testing itself: it claims every capability, so any
        # skip there means a case is tagged with one that does not exist.
        if: matrix.node == 20
        run: npm run conformance:profiles

      - name: Upload the conformance report
        if: matrix.node == 20 && always()
        uses: actions/upload-artifact@v6
        with:
          name: conformance-report
          path: conformance-report.json
          if-no-files-found: ignore

  web-editor:
    if: github.event_name != 'workflow_dispatch' || !inputs['verify-publication']
    name: Web editor (build + test)
    runs-on: ubuntu-latest
    # tools/* are intentionally NOT npm-workspace members, so the root `npm test`
    # above doesn't cover them. The web editor is the Tier-2/3 calc-integrity
    # chokepoint and carries its own vitest suite — run it here. It consumes
    # @uwmd/core's built dist via a file: dependency (and, through core,
    # @uwmd/verify's), so both must be built first.
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - name: Install workspaces
        run: npm ci
      - name: Build @uwmd/verify and @uwmd/core (web editor imports their dist)
        run: npm run build
      - name: Install web-editor deps
        run: npm ci
        working-directory: tools/web-editor
      - name: Build web editor (tsc --noEmit + vite)
        run: npm run build
        working-directory: tools/web-editor
      - name: Test web editor
        run: npm test
        working-directory: tools/web-editor

  vscode-extension:
    if: github.event_name != 'workflow_dispatch' || !inputs['verify-publication']
    name: VS Code extension (build + test)
    runs-on: ubuntu-latest
    # Same reason as the web editor: tools/* are not workspace members, so the
    # root `npm test` doesn't reach them. The extension's receipt verification
    # is pure logic behind a `vscode`-free module, so it runs under plain vitest
    # with no editor harness. It consumes @uwmd/verify's built dist (RFC 0083),
    # so verify must be built first.
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - name: Install workspaces
        run: npm ci
      - name: Build @uwmd/verify (the extension imports its dist)
        run: npm run build
      - name: Install extension deps
        run: npm ci
        working-directory: tools/vscode-uwmd
      - name: Typecheck extension
        run: npx tsc --noEmit
        working-directory: tools/vscode-uwmd
      - name: Bundle extension (esbuild)
        run: npm run build
        working-directory: tools/vscode-uwmd
      - name: Test extension
        run: npm test
        working-directory: tools/vscode-uwmd

  coverage:
    if: github.event_name != 'workflow_dispatch' || !inputs['verify-publication']
    name: Coverage report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      # RFC 0083 split the reference library: the standard modules and their
      # tests live in @uwmd/verify, the starter toolkit in @uwmd/core. Each has
      # its own floor in its vitest.config.ts.
      - name: Run @uwmd/verify test suite with coverage
        run: npm --prefix packages/uwmd-verify run test:coverage
      - name: Run @uwmd/core test suite with coverage
        if: always()
        run: npm --prefix packages/uwmd-core run test:coverage
      - name: Publish coverage summary
        if: always()
        run: |
          set -e
          for pkg in verify core; do
            summary=packages/uwmd-$pkg/coverage/coverage-summary.json
            if [ ! -f "$summary" ]; then
              echo "::warning ::coverage-summary.json not found at $summary"
              continue
            fi
            {
              echo "## @uwmd/$pkg coverage"
              echo ""
              node -e '
                const s = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).total;
                const fmt = (m) => m.pct.toFixed(2) + "% (" + m.covered + "/" + m.total + ")";
                console.log("| Metric | Coverage |");
                console.log("|---|---|");
                for (const k of ["lines", "statements", "functions", "branches"]) {
                  console.log("| " + k + " | " + fmt(s[k]) + " |");
                }
              ' "$summary"
              echo ""
            } >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Upload @uwmd/verify coverage artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: uwmd-verify-coverage
          path: packages/uwmd-verify/coverage/
          retention-days: 14
      - name: Upload @uwmd/core coverage artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: uwmd-core-coverage
          path: packages/uwmd-core/coverage/
          retention-days: 14

  validate-schemas:
    if: github.event_name != 'workflow_dispatch' || !inputs['verify-publication']
    name: Validate JSON Schemas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Compile every schema in spec/schemas/
        run: npm run validate-schemas

  windows-build-and-test:
    if: github.event_name != 'workflow_dispatch' || !inputs['verify-publication']
    name: Build, test, and conformance (Windows, Node 20)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check activated numerical consumers and receipt precedence
        # Actual production APIs; no ESM loader or source transformation. Fresh
        # Python graphs must also match the immutable preactivation references.
        run: |
          python -B -m unittest discover -s experiments/numerical-0088/activation -p "test_*.py" -v
          python -B experiments/numerical-0088/activation/capture.py --output "${{ runner.temp }}/numerical-activation-proof"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: numerical-activation-${{ runner.os }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/numerical-activation-proof/
          if-no-files-found: error
          retention-days: 14

      - name: Run conformance suite (every default suite)
        # Deliberately not a pinned --tier list. The pinned list silently
        # excluded the agent replay suite after it landed, so a suite could be
        # added to the runner's default and never actually gate a pull request.
        run: npm run conformance
