name: Feature request
description: Propose a new tool, library feature, or capability.
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        For changes to the format spec or protocol spec, use the *Spec question* template instead.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the use case. Who is affected? What are they trying to do that's currently hard or impossible?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Sketch the API, UX, or behavior you have in mind. Code snippets and examples welcome.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about and why this one is better.

  - type: dropdown
    id: scope
    attributes:
      label: Where would this live?
      options:
        - "@uwmd/core (reference library)"
        - "uwmd CLI"
        - "tools/web-viewer"
        - "A new starter tool (excel-converter, vscode-extension, etc.)"
        - "Conformance corpus"
        - "Not sure"
    validations:
      required: true
