blank_issues_enabled: false
contact_links:
  - name: Report a security vulnerability
    url: https://github.com/UWMD-OSP/UW-Markdown/blob/main/SECURITY.md
    about: Email security@uwmd.org. Do not open a public issue for a vulnerability.
  - name: How to report a problem without exposing deal data
    url: https://github.com/UWMD-OSP/UW-Markdown/blob/main/docs/FEEDBACK.md
